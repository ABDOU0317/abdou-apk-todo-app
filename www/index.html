<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهامي اليومية</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --delete-color: #cf6679;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 50px;
        }
        .container {
            background-color: var(--container-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h1 { text-align: center; color: var(--accent-color); margin-bottom: 1.5rem; }
        .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2c2c2c;
            color: white;
            outline: none;
        }
        button#add-btn {
            padding: 12px 20px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        ul { list-style: none; padding: 0; }
        li {
            background: #2c2c2c;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .task-text { flex: 1; cursor: pointer; }
        .task-text.completed { text-decoration: line-through; opacity: 0.5; }
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--delete-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مهامي اليومية</h1>
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="أضف مهمة جديدة...">
            <button id="add-btn">إضافة</button>
        </div>
        <ul id="todo-list"></ul>
    </div>

    <script>
        const input = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const list = document.getElementById('todo-list');

        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            tasks.forEach(task => createTaskElement(task.text, task.completed));
        }

        function saveTasks() {
            const tasks = [];
            document.querySelectorAll('li').forEach(li => {
                tasks.push({
                    text: li.querySelector('.task-text').innerText,
                    completed: li.querySelector('.task-text').classList.contains('completed')
                });
            });
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function createTaskElement(text, completed = false) {
            const li = document.createElement('li');
            li.innerHTML = `
                <span class="task-text ${completed ? 'completed' : ''}">${text}</span>
                <button class="delete-btn">×</button>
            `;
            
            li.querySelector('.task-text').onclick = function() {
                this.classList.toggle('completed');
                saveTasks();
            };

            li.querySelector('.delete-btn').onclick = function() {
                li.remove();
                saveTasks();
            };

            list.appendChild(li);
        }

        addBtn.onclick = () => {
            if (input.value.trim()) {
                createTaskElement(input.value.trim());
                input.value = '';
                saveTasks();
            }
        };

        input.onkeypress = (e) => { if (e.key === 'Enter') addBtn.click(); };

        loadTasks();
    </script>
</body>
</html>
